<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Eventos - Eventos Gamer</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header>
        <a th:href="@{/}">Inicio</a>
        <span>Hola, <span sec:authentication="name">usuario</span></span>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Cerrar sesión</button>
        </form>
    </header>

    <h1>Eventos</h1>

    <form th:action="@{/eventos}" method="get">
        <label>Categoría:
            <select name="categoria">
                <option value="">Todas</option>
                <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"
                        th:selected="${c == categoriaSel}"></option>
            </select>
        </label>
        <label>Fecha:
            <input type="date" name="fecha" th:value="${fechaSel}">
        </label>
        <label>Ubicación:
            <select name="ubicacion">
                <option value="">Todas</option>
                <option th:each="u : ${ubicaciones}" th:value="${u}" th:text="${u}"
                        th:selected="${u == ubicacionSel}"></option>
            </select>
        </label>
        <button type="submit">Buscar</button>
        <a th:href="@{/eventos}">Limpiar</a>
    </form>

    <p th:if="${#lists.isEmpty(eventos)}">No se encontraron eventos con esos filtros.</p>

    <ul>
        <li th:each="e : ${eventos}">
            <a th:href="@{/eventos/{id}(id=${e.id})}" th:text="${e.nombre}">Evento</a>
            - <span th:text="${e.categoria}"></span>
            - <span th:text="${#temporals.format(e.fecha, 'dd-MM-yyyy')}"></span>
            - <span th:text="${e.ubicacion}"></span>
        </li>
    </ul>
</body>
</html>
