<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Eventos Gamer</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}">
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/eventos}">Eventos</a>
            <a th:href="@{/perfil}">Mi perfil</a>
        </nav>
        <span>Hola, <span sec:authentication="name">usuario</span></span>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Cerrar sesión</button>
        </form>
    </header>
    <main class="container">
    <section>
        <h2>Eventos destacados</h2>
        <p th:if="${#lists.isEmpty(destacados)}">No hay eventos destacados por ahora.</p>
        <ul class="lista-eventos">
            <li th:each="e : ${destacados}">
                <a th:href="@{/eventos/{id}(id=${e.id})}" th:text="${e.nombre}">Evento</a>
                - <span th:text="${#temporals.format(e.fecha, 'dd-MM-yyyy')}"></span>
                - <span th:text="${e.ubicacion}"></span>
            </li>
        </ul>
    </section>

    <section>
        <h2>Próximos eventos</h2>
        <p th:if="${#lists.isEmpty(proximos)}">No hay eventos próximos.</p>
        <ul class="lista-eventos">
            <li th:each="e : ${proximos}">
                <a th:href="@{/eventos/{id}(id=${e.id})}" th:text="${e.nombre}">Evento</a>
                - <span th:text="${e.categoria}"></span>
                - <span th:text="${#temporals.format(e.fecha, 'dd-MM-yyyy')}"></span>
                - <span th:text="${e.ubicacion}"></span>
            </li>
        </ul>
    </section>

    <section>
        <h2>Marcas asociadas</h2>
        <ul class="lista-marcas">
            <li th:each="m : ${marcas}" th:text="${m}">Marca</li>
        </ul>
    </section>
    </main>
</body>
</html>
