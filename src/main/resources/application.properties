spring.application.name=eventogamer


# Configuración JWT (Clave HMAC-SHA256 de 256 bits y expiración de 24 horas en ms)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Base de datos (credenciales desde variables de entorno)
spring.datasource.url=jdbc:mysql://localhost:3306/eventogamer
spring.datasource.username=${DB_USER:eventogamer_app}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Seguridad y Calidad: no exponer stacktraces ni mensajes internos
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false

# Cookie de sesión: solo se envía en peticiones del mismo sitio (protección CSRF adicional)
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true

# Contraseñas de los usuarios iniciales (desde variables de entorno, nunca en el código)
app.seed.user-password=${SEED_USER_PASSWORD:}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}