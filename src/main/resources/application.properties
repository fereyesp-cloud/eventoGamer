spring.application.name=eventogamer

# Seguridad y Calidad: no exponer stacktraces ni mensajes internos
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Configuración JWT (Clave HMAC-SHA256 de 256 bits y expiración de 24 horas en ms)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Base de datos (credenciales desde variables de entorno)
spring.datasource.url=jdbc:mysql://localhost:3306/eventogamer
spring.datasource.username=${DB_USER:eventogamer_app}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false